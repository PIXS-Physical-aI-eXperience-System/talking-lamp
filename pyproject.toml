[project]
name = "talking-lamp"
version = "0.1.0"
description = "Talking Lamp - onboard AI robot lamp (team PIXS)"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.12",
    "numpy>=2",
    "ruckig>=0.14",  # online jerk-limited trajectory generation (has an analytic fallback)
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:... blocks the pytest plugins a sourced ROS env registers on PYTHONPATH
# (launch_pytest / launch_testing), which fail to import inside this venv.
addopts = "-q -p no:launch_pytest -p no:launch_testing"

[tool.uv]
package = false
