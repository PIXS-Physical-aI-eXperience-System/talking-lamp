<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 575" width="100%" role="img"
     aria-label="Talking Lamp 전체 파이프라인. 카메라와 마이크 입력이 Jetson에서 검출·인지·음성 처리되고, 3D 좌표와 프리미티브 이름만 Raspberry Pi로 넘어가 모션 블렌더와 궤적 생성기를 거쳐 서보로 나감.">
  <style>
    .bg     { fill:#ffffff }
    .cluster{ fill:#fafafa; stroke:#c2c2c2; stroke-width:1.2; stroke-dasharray:5 4 }
    .node   { fill:#ffffff; stroke:#8f8f8f; stroke-width:1.2 }
    .io     { fill:#f1f1f3; stroke:#8f8f8f; stroke-width:1.2 }
    .edge   { stroke:#7a7a7a; stroke-width:1.4; fill:none }
    .arrow  { fill:#7a7a7a }
    .t      { fill:#1a1a1a; font-size:13px }
    .ts     { fill:#5c5c5c; font-size:10.5px }
    .ct     { fill:#3a3a3a; font-size:13px; font-weight:600 }
    .lbl    { fill:#4a4a4a; font-size:11px }
    .lblbg  { fill:#ffffff }
    text    { font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif }
    @media (prefers-color-scheme: dark) {
      .bg     { fill:#1b1b1d }
      .cluster{ fill:#242427; stroke:#4d4d55 }
      .node   { fill:#2b2b30; stroke:#6d6d76 }
      .io     { fill:#34343a; stroke:#6d6d76 }
      .edge   { stroke:#9a9aa4 }
      .arrow  { fill:#9a9aa4 }
      .t      { fill:#f0f0f2 }
      .ts     { fill:#b2b2ba }
      .ct     { fill:#d8d8de }
      .lbl    { fill:#c6c6ce }
      .lblbg  { fill:#1b1b1d }
    }
  </style>

  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
  </marker>

  <rect class="bg" x="0" y="0" width="1320" height="575"/>

  <!-- clusters -->
  <rect class="cluster" x="170" y="75" width="485" height="395" rx="10"/>
  <text class="ct" x="185" y="99">Jetson Orin Nano 8GB · AI 추론</text>
  <rect class="cluster" x="775" y="75" width="380" height="395" rx="10"/>
  <text class="ct" x="790" y="99">Raspberry Pi 5 · 실시간 제어 100 Hz</text>

  <!-- edges -->
  <path class="edge" marker-end="url(#a)" d="M130,166 L168,166 L168,154 L195,154"/>
  <path class="edge" marker-end="url(#a)" d="M130,182 L152,182 L152,263 L440,263"/>
  <path class="edge" marker-end="url(#a)" d="M130,382 L195,382"/>
  <path class="edge" marker-end="url(#a)" d="M130,394 L143,394 L143,45 L760,45 L760,168 L800,168"/>
  <path class="edge" marker-end="url(#a)" d="M345,382 L390,382 L390,285 L440,285"/>
  <path class="edge" marker-end="url(#a)" d="M345,154 L440,154"/>
  <path class="edge" marker-end="url(#a)" d="M270,125 L270,62 L878,62 L878,125"/>
  <path class="edge" marker-end="url(#a)" d="M635,154 L745,154 L745,309 L800,309"/>
  <path class="edge" marker-end="url(#a)" d="M635,263 L700,263 L700,232 L800,232"/>
  <path class="edge" marker-end="url(#a)" d="M538,301 L538,360"/>
  <path class="edge" marker-end="url(#a)" d="M538,404 L538,525 L1190,525"/>
  <path class="edge" marker-end="url(#a)" d="M955,154 L962,154 L962,225 L985,225"/>
  <path class="edge" marker-end="url(#a)" d="M955,232 L985,232"/>
  <path class="edge" marker-end="url(#a)" d="M955,309 L970,309 L970,248 L985,248"/>
  <path class="edge" marker-end="url(#a)" d="M955,399 L976,399 L976,260 L985,260"/>
  <path class="edge" marker-end="url(#a)" d="M1060,268 L1060,330"/>
  <path class="edge" marker-end="url(#a)" d="M1135,359 L1190,359"/>

  <!-- edge labels -->
  <rect class="lblbg" x="269" y="252" width="62" height="16"/>
  <text class="lbl" x="300" y="264" text-anchor="middle">이미지 1장</text>
  <rect class="lblbg" x="134" y="362" width="56" height="16"/>
  <text class="lbl" x="162" y="374" text-anchor="middle">잡음 제거</text>
  <rect class="lblbg" x="355" y="133" width="74" height="16"/>
  <text class="lbl" x="392" y="145" text-anchor="middle">물체 3D 위치</text>
  <rect class="lblbg" x="663" y="51" width="74" height="16"/>
  <text class="lbl" x="700" y="63" text-anchor="middle">얼굴 3D 위치</text>
  <rect class="lblbg" x="387" y="34" width="86" height="16"/>
  <text class="lbl" x="430" y="46" text-anchor="middle">방향 추정 DOA</text>
  <rect class="lblbg" x="641" y="133" width="122" height="16"/>
  <text class="lbl" x="702" y="145" text-anchor="middle">3D 타겟점 + 접근 방향</text>
  <rect class="lblbg" x="717" y="211" width="90" height="16"/>
  <text class="lbl" x="762" y="223" text-anchor="middle">프리미티브 이름</text>
  <rect class="lblbg" x="523" y="319" width="30" height="16"/>
  <text class="lbl" x="538" y="331" text-anchor="middle">대사</text>
  <rect class="lblbg" x="1032" y="288" width="56" height="16"/>
  <text class="lbl" x="1060" y="300" text-anchor="middle">관절 각도</text>

  <!-- IO nodes -->
  <rect class="io" x="20" y="150" width="110" height="44" rx="22"/>
  <text class="t" x="75" y="178" text-anchor="middle">카메라</text>
  <rect class="io" x="20" y="360" width="110" height="44" rx="22"/>
  <text class="t" x="75" y="388" text-anchor="middle">마이크</text>
  <rect class="io" x="1190" y="330" width="105" height="58" rx="29"/>
  <text class="t" x="1243" y="354" text-anchor="middle">서보 5축</text>
  <text class="ts" x="1243" y="372" text-anchor="middle">+ 조명</text>
  <rect class="io" x="1190" y="505" width="105" height="40" rx="20"/>
  <text class="t" x="1243" y="530" text-anchor="middle">스피커</text>

  <!-- Jetson nodes -->
  <rect class="node" x="195" y="125" width="150" height="58" rx="5"/>
  <text class="t" x="270" y="149" text-anchor="middle">검출기</text>
  <text class="ts" x="270" y="167" text-anchor="middle">얼굴 · 물체 찾기</text>
  <rect class="node" x="440" y="125" width="195" height="58" rx="5"/>
  <text class="t" x="538" y="149" text-anchor="middle">L3 조명 타겟 계산</text>
  <text class="ts" x="538" y="167" text-anchor="middle">어디를 어느 방향에서 비출지</text>
  <rect class="node" x="440" y="225" width="195" height="76" rx="5"/>
  <text class="t" x="538" y="249" text-anchor="middle">L2 인지 · VLM</text>
  <text class="ts" x="538" y="267" text-anchor="middle">입력: 이미지 1장 + 텍스트</text>
  <text class="ts" x="538" y="285" text-anchor="middle">출력: 대사 + 행동 태그</text>
  <rect class="node" x="195" y="360" width="150" height="44" rx="5"/>
  <text class="t" x="270" y="387" text-anchor="middle">음성 인식</text>
  <rect class="node" x="440" y="360" width="195" height="44" rx="5"/>
  <text class="t" x="538" y="387" text-anchor="middle">음성 합성</text>

  <!-- Pi nodes -->
  <rect class="node" x="800" y="125" width="155" height="58" rx="5"/>
  <text class="t" x="878" y="149" text-anchor="middle">L1 반사</text>
  <text class="ts" x="878" y="167" text-anchor="middle">칼만 필터 + IK</text>
  <rect class="node" x="800" y="210" width="155" height="44" rx="5"/>
  <text class="t" x="878" y="237" text-anchor="middle">L2 프리미티브 재생</text>
  <rect class="node" x="800" y="280" width="155" height="58" rx="5"/>
  <text class="t" x="878" y="304" text-anchor="middle">L3 조명 자세</text>
  <text class="ts" x="878" y="322" text-anchor="middle">IK</text>
  <rect class="node" x="800" y="370" width="155" height="58" rx="5"/>
  <text class="t" x="878" y="394" text-anchor="middle">L0 대기 모션</text>
  <text class="ts" x="878" y="412" text-anchor="middle">호흡 · 미세 시선</text>
  <rect class="node" x="985" y="210" width="150" height="58" rx="5"/>
  <text class="t" x="1060" y="234" text-anchor="middle">모션 블렌더</text>
  <text class="ts" x="1060" y="252" text-anchor="middle">레이어 우선순위 합성</text>
  <rect class="node" x="985" y="330" width="150" height="58" rx="5"/>
  <text class="t" x="1060" y="354" text-anchor="middle">궤적 생성기</text>
  <text class="ts" x="1060" y="372" text-anchor="middle">속도 · 가속 · 저크 제한</text>
</svg>
